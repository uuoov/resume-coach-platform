version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: resume-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-resume_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resume_password}
      POSTGRES_DB: ${DB_NAME:-resume_coach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/seed:/docker-entrypoint-initdb.d  # 初始化数据
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resume_user} -d ${DB_NAME:-resume_coach}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 缓存（可选，用于提高性能）
  redis:
    image: redis:7-alpine
    container_name: resume-coach-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: resume-coach-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-resume_user}:${DB_PASSWORD:-resume_password}@postgres:5432/${DB_NAME:-resume_coach}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      FILE_STORAGE_PATH: /app/uploads
      # 可选配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_REGION: ${OSS_REGION}
      QICHACHA_API_KEY: ${QICHACHA_API_KEY}
    volumes:
      - uploads_data:/app/uploads
    # ports:
    #   - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Nginx 反向代理（可选，用于生产环境优化）
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    container_name: resume-coach-nginx
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Prisma 迁移服务（用于初始化数据库）
  prisma-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: resume-coach-prisma-migrate
    environment:
      DATABASE_URL: postgresql://${DB_USER:-resume_user}:${DB_PASSWORD:-resume_password}@postgres:5432/${DB_NAME:-resume_coach}?schema=public
    command: ["npm", "run", "prisma:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
